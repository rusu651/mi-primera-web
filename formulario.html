<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../estilos.css">
    <title>formulario.html</title>
</head>
<body>
    <p id="formulario">Si desea rellenar nuestro formulario indicando el tipo de bicicleta que busca, se le responderá con la mayor brevedad posible.</p>
    <form action="">
        <h2>FORMULARIO</h2>
        <label for="nombre">Nombre:</label> <br>
        <input type="text" id="nombre" name="nombre"> <br>
        <label for="apellidos">Apellidos:</label> <br>
        <input type="text" id="apellidos" name="apellidos"> <br>
        <label for="direccion">Dirección:</label> <br>
        <input type="text" id="direccion" name="direccion"> <br>
        <label for="correo">Correo electrénico:</label> <br>
        <input type="email" id="correo" name="correo"> <br>
        <label for="telefono">Teléfono:</label> <br>
        <input type="tel" id="telefono" name="telefono"> <br>
        <label for="nacimiento">Fecha de nacimiento:</label> <br>
        <input type="date" id="nacimiento" name="nacimiento"> <br>
        <label for="sexo">Sexo:</label> <br>
        <input type="radio" id="masculino" name="masculino" value="masculino">
        <label for="masculino">Masculino</label>
        <input type="radio" id="femenino" name="femenino" value="femenino">
        <label for="masculino">Femenino</label> <br>
        <label for="bicicleta">Bicicleta (nueva o usada):</label> <br>
        <textarea name="bicicleta" id="bicicleta"></textarea> <br>
        <label for="observaciones">Observaciones:</label> <br>
        <textarea name="observaciones" id="observaciones" rows="20" cols="40"></textarea> <br>
        <input type="submit" name="enviar" id="enviar">
    </form>
    <div id="formulario1">
        <h3>MENU</h3>
        <a href="../index.html">INICIO</a> <a href="../bicicleta.html">BICICLETAS</a> <a href="../formulario.html">FORMULARIO</a>
    </div>
</body>
</html>
